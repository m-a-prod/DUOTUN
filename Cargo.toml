[package]
name = "duotun"
version = "0.1.0"
edition = "2024"
description = "Route all traffic through a SOCKS5 proxy (xray) via a TUN device, without DNS leaks"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tun-rs = { version = "2.8.11", features = ["async"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"
